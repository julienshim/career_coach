name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: store suite (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10+: the latest runner image no longer ships 3.9 in its version
        # manifest; the 3.9 floor is the development environment, where the
        # suite runs every session
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the store test suite
        run: python -m unittest discover -s tests -t . -v
